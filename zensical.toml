      "plans/2026-03-23-kld7-angle-radar-design.md",
      "plans/2026-03-28-kld7-integration-design.md",
      "plans/2026-04-05-kld7-radc-processing-design.md",
      "plans/2026-04-10-spin-detection-rework-design.md",
      "superpowers/specs/2026-04-15-spin-angle-validation-design.md",
      "superpowers/specs/2026-04-20-hardware-diagnostic-design.md",
      "superpowers/specs/2026-06-09-kld7-prf-probing-design.md",
      "superpowers/specs/2026-07-25-iwr6843-club-path-design.md",
      "superpowers/specs/2026-08-09-optional-build-items-design.md",
