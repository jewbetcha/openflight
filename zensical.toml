    { "Implementation plans" = [
      "plans/2026-03-03-enhanced-launch-angle-plan.md",
      "plans/2026-03-28-kld7-integration-plan.md",
      "plans/2026-04-05-kld7-radc-processing-plan.md",
      "plans/2026-04-06-radc-launch-angle-fullstack.md",
      "plans/2026-04-10-spin-detection-rework-plan.md",
      "plans/kld7-club-extraction-TODO.md",
