    "inclinometer/README.md",
    "battery/README.md",
    "battery/geekworm.md",
    "build/enclosure.md",
  ] },
  { "Using OpenFlight" = [
    "swing-speed-training.md",
    "simulator/README.md",
    "simulator/gspro.md",
    "simulator/opengolfsim.md",
    "cloud-sync.md",
    "observability.md",
  ] },
  { "How it works" = [
