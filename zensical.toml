  { "Home" = "index.md" },
  { "Get started" = [
    "PARTS.md",
    "raspberry-pi-setup.md",
  ] },
  { "Build" = [
    "sound-trigger-wiring.md",
    "ops243-uart-migration.md",
    "iwr6843/README.md",
