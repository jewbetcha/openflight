[project]
site_url = "https://openflight.dev/docs/"
site_name = "OpenFlight Docs"

# Config lives at the repo root so every existing `docs/…` link — from the
# README, CONTRIBUTING, and between the guides — keeps resolving unchanged.
docs_dir = "docs"
site_dir = "site"
site_description = "Build guide, hardware reference, and internals for OpenFlight — the DIY golf launch monitor you build yourself from off-the-shelf radars."
site_author = "OpenFlight contributors"

copyright = "Copyright &copy; 2026 OpenFlight contributors &middot; AGPL-3.0"

repo_url = "https://github.com/jewbetcha/openflight"
repo_name = "jewbetcha/openflight"
edit_uri = "edit/main/docs/"

# Phase 1 nav: every existing page reachable, current flat layout.
# Phase 2 reorganises this into the seven-section architecture.
